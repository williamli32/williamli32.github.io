<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TOP SECRET</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #000000;
            text-align: center;
        }

        h1 {
            color: #dddddd;
        }

        .genome-box {
            display: inline-block;
            background-color: #dddddd;
            border-radius: 8px;
            padding: 20px;
            width: 100%;
            max-width: 1000px;
            height: 100%;
            max-height: 600px;
            font-family: monospace;
            font-size: 1.5em;
            line-height: 1.5em;
            word-wrap: break-word;
            margin-top: 20px;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 1em;
            cursor: pointer;
            border-radius: 5px;
            border: none;
            background-color: #963fbb;
            color: white;
            width: 150px;
        }

        button:hover {
            background-color: #702f8c;
        }
    </style>
</head>
<body>
    <h1>William's Genome (WARNING: TOP SECRET. DO NOT DOX.)</h1>
    <div class="genome-box" id="genomeBox">
        <!-- Nucleotides will appear here -->
    </div>
    <br>
    <button onclick="dox()">DOX!!!!</button>
    <script>
        const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
        async function generateGenome() {
            let currentGenome = '';
            while(true) {
                const nucleotides = ['A', 'T', 'G', 'C'];
                const numNucleotides = 1929;
                let genome = '';
                if(currentGenome.length === 0) {
                    for (let i = 0; i < numNucleotides; i++) {
                        genome += nucleotides[Math.floor(Math.random() * nucleotides.length)];
                    }
                }
                else {
                    genome = currentGenome.slice(1) + nucleotides[Math.floor(Math.random() * nucleotides.length)];
                }
                currentGenome = genome;

                document.getElementById('genomeBox').textContent = currentGenome + "...";
                await sleep(1400);
            }
            
        }

        function dox() {
            let randomNumber = Math.floor(Math.random() * 8);
            if (randomNumber === 0) {
                alert("Doxxing William's genome... Genome successfully doxxed!")
            }
            else if (randomNumber === 1) {
                alert("Doxxing failed. please try again.")
            }
            else if (randomNumber === 2) {
                alert("Doxxing Gigi's genome... wait, aren't we supposed to dox William's? ... Uh oh, Gigi's genome successfully doxxed!")
            }
            else if (randomNumber === 3) {
                alert("ALERT: Genome doxxing requires a kiss to proceed. Please kiss your boyfriend. Doxxing failed.")
            }
            else if (randomNumber === 4) {
                alert("Pie Jesu Domine, dona eis requiem. Pie Jesu... oh sorry! Commencing genome doxxing... Doxxing complete!")
            }
            else if (randomNumber === 5) {
                alert("Here's that lox you wanted! ... Oh wait, wrong order. Doxxing William's genome... Doxxing failed. Error code: lox got into the system.")
            }
            else if (randomNumber === 6) {
                alert("Doxxing William's genome... Genome doxxing failed with 1 error: William is too cute to dox.")
            }
            else if (randomNumber === 7) {
                alert("Cannot dox genome at this time. Frankie is currently sleeping on the keyboard. Please try again later.")
            }
        }
        generateGenome();
    </script>
</body>
</html>
